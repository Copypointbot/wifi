<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скан-сервис — подключение</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f2f4f8;
    color: #1d1d1f;
  }
  .card {
    max-width: 420px;
    margin: 24px auto;
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { margin: 0 0 20px; color: #666; font-size: 14px; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border-radius: 10px; background: #f2f4f8;
    margin-bottom: 10px; font-size: 15px;
  }
  .row b { word-break: break-all; }
  .hint { font-size: 13px; color: #666; margin: 4px 0 22px; }
  .btn {
    display: block; text-align: center; text-decoration: none;
    background: #2ea6ff; color: #fff; font-size: 17px; font-weight: 600;
    padding: 15px 10px; border-radius: 12px; margin-bottom: 10px;
  }
  .btn:active { background: #1e8fe0; }
  .note { font-size: 12px; color: #999; text-align: center; margin: 10px 0 0; }
</style>
</head>
<body>
<div class="card">
  <h1>Добро пожаловать!</h1>
  <p class="sub">Подключитесь к сети и откройте бота — два простых шага.</p>

  <div class="row"><span>Сеть Wi-Fi</span> <b>sambatya</b></div>
  <div class="row"><span>Пароль</span> <b>03292305</b></div>
  <p class="hint">Если Wi-Fi не подхватился сам — откройте настройки Wi-Fi и выберите эту сеть.</p>

  <a class="btn" href="https://t.me/copypointbot">Открыть бота в Telegram</a>
  <p class="note">Если кнопка не открывается — установите Telegram.</p>
</div>
</body>
</html>
